[project]
name = "kinetiq-v-vision"
version = "0.1.0"
description = "Kinetiq V Vision engine for real-time target tracking and exercise observation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.scripts]
kinetiq-vision = "kinetiq_v_vision.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetiq_v_vision"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "pytest>=9.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B008"]
